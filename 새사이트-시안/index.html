<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 사이트 시안</title>
<style>
@font-face { font-family: "Paperlogy"; font-weight: 400; src: url("../public/fonts/Paperlogy-400.ttf"); }
@font-face { font-family: "Paperlogy"; font-weight: 500; src: url("../public/fonts/Paperlogy-500.ttf"); }
@font-face { font-family: "Paperlogy"; font-weight: 600; src: url("../public/fonts/Paperlogy-600.ttf"); }
@font-face { font-family: "Paperlogy"; font-weight: 700; src: url("../public/fonts/Paperlogy-700.ttf"); }
@font-face { font-family: "Paperlogy"; font-weight: 800; src: url("../public/fonts/Paperlogy-800.ttf"); }
:root { --navy: #0a2b70; --blue: #0c3994; --red: #e84340; --gray: #898989; --ink: #141a26; --ink2: #3b4558; --muted: #7a8396;
  --line: #e7eaf0; --bg: #f4f6fa; --card: #fff; --r: 14px; --font: "Paperlogy", "Malgun Gothic", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--ink); background: #dfe3ea; font-size: 15px; }
button, select, input, textarea { font: inherit; }
a { cursor: pointer; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 시안 고르기 막대 */
.picker { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 18px; height: 50px;
  background: #1b1f27; color: #cfd5e0; font-size: .85rem; }
.picker b { color: #fff; margin-right: 4px; }
.picker .grp { display: flex; gap: 4px; align-items: center; }
.picker button { border: 1px solid #3a4150; background: #262b35; color: #cfd5e0; border-radius: 999px; padding: 5px 13px; cursor: pointer; }
.picker button.on { background: #fff; color: #111; border-color: #fff; font-weight: 700; }
.picker .note { margin-left: auto; color: #8d96a8; }
#app { min-height: calc(100vh - 50px); background: var(--bg); }

/* ---------- 공통 부품 ---------- */
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-h h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
.page-h .pdesc { color: var(--muted); font-size: .88rem; margin-top: 4px; }
.crumb { color: var(--muted); font-size: .8rem; margin-bottom: 4px; }
.crumb a { color: var(--muted); text-decoration: none; } .crumb a:hover { color: var(--blue); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink2); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; text-decoration: none; }
.btn:hover { border-color: #c5cbd6; }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; }
.card h3 { margin: 0 0 12px; font-size: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h3 small { color: var(--muted); font-weight: 500; font-size: .8rem; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); margin-top: 16px; }
.half { grid-template-columns: 1fr 1fr; margin-top: 16px; }
@media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } .two, .half { grid-template-columns: 1fr; } }
.kpi { cursor: pointer; transition: transform .15s; } .kpi:hover { transform: translateY(-2px); }
.kpi .l { color: var(--muted); font-size: .85rem; display: flex; align-items: center; gap: 8px; }
.kpi .n { font-size: 2rem; font-weight: 800; margin-top: 6px; letter-spacing: -.02em; }
.kpi .n small { font-size: .9rem; color: var(--muted); font-weight: 600; margin-left: 3px; }
.kpi .t { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.kpi.warn .n { color: var(--red); }
.ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--c, var(--blue)); background: color-mix(in srgb, var(--c, var(--blue)) 12%, #fff); flex: none; }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; align-items: center; gap: 12px; padding: 11px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 8px; }
.todo li:hover { background: #f6f8fc; }
.todo li:first-child { border-top: 0; }
.todo .w { flex: 1; min-width: 0; }
.todo .w b { display: block; font-size: .92rem; }
.todo .w span { color: var(--muted); font-size: .8rem; }
.tag { font-size: .74rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.tag.r { background: #fde9e8; color: #c23330; } .tag.o { background: #fff1dc; color: #b45f06; } .tag.b { background: #e6edfb; color: var(--blue); } .tag.g { background: #e3f4e8; color: #1f7a3b; } .tag.k { background: #eef0f4; color: #5b6475; } .tag.v { background: #efe7fd; color: #6d28d9; }
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.area { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 12px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 600; font-size: .9rem; background: #fff; }
.area:hover { border-color: var(--c); }
.area .ico { width: 42px; height: 42px; border-radius: 13px; }
.leaves li { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px dashed var(--line); font-size: .9rem; }
.leaves li:first-child { border-top: 0; }
.leaves { list-style: none; margin: 0; padding: 0; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters select, .filters input { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: #fff; color: var(--ink2); }
.filters input { min-width: 220px; }
.seg { display: inline-flex; background: #eef1f6; border-radius: 10px; padding: 3px; }
.seg span { padding: 5px 12px; border-radius: 8px; font-size: .85rem; color: var(--muted); font-weight: 600; cursor: pointer; }
.seg span.on { background: #fff; color: var(--blue); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: .8rem; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td.num, .t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.t tbody tr { cursor: pointer; } .t tbody tr:hover td { background: #f6f8fc; }
.who { display: flex; align-items: center; gap: 10px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: #fff; background: var(--c, var(--blue)); flex: none; }
.bar { height: 7px; background: #edf0f5; border-radius: 9px; width: 120px; overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; border-radius: 9px; background: var(--blue); }
.bar.hi i { background: var(--red); }
.pct { display: inline-block; width: 46px; text-align: right; margin-left: 8px; font-size: .82rem; color: var(--muted); }
.neg { color: var(--red); font-weight: 700; }
.empty-note { color: var(--muted); font-size: .85rem; padding: 8px 2px 2px; }

/* 영역 홈 */
.ahome { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.acard { display: flex; gap: 12px; align-items: flex-start; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; transition: border-color .15s, transform .15s; }
.acard:hover { border-color: var(--c); transform: translateY(-2px); }
.acard b { display: block; } .acard span.d { color: var(--muted); font-size: .8rem; line-height: 1.4; display: block; margin-top: 3px; }
.acard .cnt { margin-left: auto; }
.gtitle { font-size: .82rem; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }

/* 일일 현황 보드 */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .board { grid-template-columns: 1fr 1fr; } }
.bcol { background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 12px; padding: 12px; }
.bcol h4 { margin: 0 0 10px; color: var(--c); display: flex; justify-content: space-between; }
.bchip { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; background: #f7f8fb; margin-bottom: 6px; font-size: .88rem; cursor: pointer; }
.bchip small { color: var(--muted); margin-left: auto; }

/* 캘린더 */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cal .h { padding: 8px; font-size: .8rem; color: var(--muted); font-weight: 700; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fafbfd; }
.cal .d { min-height: 96px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: .8rem; }
.cal .d .n { font-weight: 700; color: var(--ink2); margin-bottom: 4px; }
.cal .d.sun .n, .cal .d.hol .n { color: var(--red); } .cal .d.sat .n { color: #2563eb; }
.cal .d.today { box-shadow: inset 0 0 0 2px var(--blue); }
.cal .ev { display: block; padding: 2px 6px; border-radius: 5px; margin-bottom: 3px; font-size: .74rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

/* 조직도 */
.orgc { display: flex; flex-direction: column; align-items: center; gap: 0; overflow-x: auto; padding: 10px 0; }
.on { }
.onode { background: #fff; border: 1.5px solid var(--c, var(--blue)); border-radius: 10px; min-width: 130px; text-align: center; overflow: hidden; }
.onode .oh { background: var(--c, var(--blue)); color: #fff; font-weight: 700; padding: 7px 12px; }
.onode .op { padding: 5px 10px; font-size: .84rem; border-top: 1px solid var(--line); }
.orow { display: flex; gap: 14px; justify-content: center; position: relative; padding-top: 22px; }
.orow::before { content: ""; position: absolute; top: 10px; left: 70px; right: 70px; border-top: 2px solid #c3c9d4; }
.orow > div { position: relative; }
.orow > div::before { content: ""; position: absolute; top: -12px; left: 50%; height: 12px; border-left: 2px solid #c3c9d4; }
.ovl { width: 2px; height: 12px; background: #c3c9d4; }

/* 서랍·창·알림 */
.overlay { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 80; display: flex; justify-content: flex-end; }
.overlay.center { justify-content: center; align-items: center; }
.drawer { width: min(440px, 100%); height: 100%; background: #fff; padding: 22px 24px; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,.15); animation: slide .2s ease; }
.modal { width: min(560px, 94%); max-height: 90vh; overflow-y: auto; background: #fff; border-radius: 16px; padding: 22px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.drawer h2, .modal h2 { margin: 0 0 4px; font-size: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
.x { border: 0; background: none; font-size: 1.4rem; color: var(--muted); cursor: pointer; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 10px 12px; margin: 16px 0; font-size: .92rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.fgrid label { display: flex; flex-direction: column; gap: 5px; font-size: .84rem; color: var(--ink2); font-weight: 600; }
.fgrid input, .fgrid select, .fgrid textarea { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-weight: 400; }
.fgrid .wide { grid-column: 1 / -1; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1b1f27; color: #fff; padding: 11px 18px; border-radius: 12px; z-index: 90; font-size: .9rem; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.hist { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); }
.hist li { padding: 0 0 12px 14px; position: relative; font-size: .86rem; }
.hist li::before { content: ""; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.hist small { color: var(--muted); display: block; }

/* 인증 카드 */
.certs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.cc { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
.cc:hover { box-shadow: 0 6px 16px -8px rgba(0,0,0,.2); }
.cc b { display: block; margin-bottom: 4px; } .cc span { color: var(--muted); font-size: .82rem; display: block; }

/* ---------- A4 인쇄본 ---------- */
.print-wrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
.paper-box { background: #c9ced8; border-radius: 12px; padding: 20px; overflow: hidden; }
.sheet { width: 297mm; height: 210mm; background: #fff; padding: 12mm 13mm 10mm; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  transform-origin: top left; color: #111; font-size: 10.5pt; overflow: hidden; }
.sh-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10mm; }
.sh-title { font-size: 22pt; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.sh-meta { color: #555; margin-top: 2mm; font-size: 9.5pt; }
.sign { border-collapse: collapse; font-size: 9pt; }
.sign th, .sign td { border: 1px solid #9aa1ad; width: 20mm; text-align: center; }
.sign th { background: #f1f3f6; padding: 1.2mm 0; font-weight: 600; }
.sign td { height: 14mm; }
.sheet table.t { font-size: 9.5pt; margin-top: 6mm; }
.sheet .t tbody tr { cursor: default; }
.sheet .t th { color: #fff; background: var(--blue); font-size: 9pt; padding: 2.2mm 3mm; border: 0; }
.sheet .t td { padding: 2mm 3mm; border-bottom: 1px solid #d9dde4; }
.sheet .t tr:nth-child(even) td { background: #f6f8fb; }
.sheet .bar { width: 30mm; height: 2.4mm; }
.sh-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; color: #666; font-size: 8.5pt; border-top: 1px solid #d9dde4; padding-top: 3mm; }
.sh-foot img { height: 9mm; }
.explain { flex: 1; min-width: 260px; max-width: 380px; }
.explain li { margin-bottom: 8px; line-height: 1.55; color: var(--ink2); font-size: .9rem; }

/* ================= 시안 A: 깔끔한 흰색 · 위쪽 메뉴 ================= */
.sk-a { --bg: #f6f7f9; --r: 18px; }
.sk-a .top { position: sticky; top: 50px; z-index: 5; background: rgba(255,255,255,.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.sk-a .top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 24px; padding: 0 24px; height: 62px; }
.sk-a .top img { height: 30px; cursor: pointer; }
.sk-a .nav { display: flex; gap: 2px; flex: 1; }
.sk-a .nav a { padding: 8px 13px; border-radius: 10px; color: var(--ink2); text-decoration: none; font-weight: 600; font-size: .93rem; }
.sk-a .nav a:hover { background: #f2f4f8; }
.sk-a .nav a.on { color: var(--blue); background: #edf2fc; }
.sk-a .subnav { border-top: 1px solid var(--line); }
.sk-a .subnav-in { max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; gap: 2px; overflow-x: auto; }
.sk-a .subnav a { padding: 10px 12px; font-size: .86rem; color: var(--muted); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; font-weight: 600; }
.sk-a .subnav a.on { color: var(--blue); border-bottom-color: var(--blue); }
.sk-a .me { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .88rem; }
.sk-a .content { max-width: 1240px; margin: 0 auto; padding: 28px 24px 60px; }
.sk-a .card, .sk-a .acard { border: 0; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px -12px rgba(16,24,40,.14); }
.sk-a .hello { margin-bottom: 22px; }
.sk-a .hello h1 { font-size: 1.9rem; margin: 4px 0 0; letter-spacing: -.03em; }
.sk-a .hello h1 em { font-style: normal; color: var(--blue); }
.sk-a .hello p { color: var(--muted); margin: 6px 0 0; }
.sk-a .sheet .t th { background: #fff; color: #333; border-bottom: 2px solid #111; }
.sk-a .sheet .t tr:nth-child(even) td { background: #fff; }

/* ================= 시안 B: 남색 사이드바 ================= */
.sk-b { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
.sk-b .side { background: linear-gradient(185deg, #0a2b70, #0c3994 62%, #1747a6); color: #e9eef8; padding: 18px 14px; position: sticky; top: 50px; align-self: start;
  height: calc(100vh - 50px); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.sk-b .side .logo { background: #fff; border-radius: 14px; padding: 10px 12px; margin-bottom: 14px; cursor: pointer; }
.sk-b .side .logo img { width: 100%; display: block; }
.sk-b .side .g { font-size: .72rem; color: rgba(233,238,248,.55); padding: 12px 10px 4px; font-weight: 700; }
.sk-b .side a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; color: #eef3fb; text-decoration: none; font-weight: 600; font-size: .93rem; }
.sk-b .side a:hover { background: rgba(255,255,255,.08); }
.sk-b .side a .ico { width: 28px; height: 28px; border-radius: 9px; background: rgba(255,255,255,.13); color: #fff; }
.sk-b .side a.on { background: #fff; color: var(--navy); }
.sk-b .side a.on .ico { background: var(--blue); }
.sk-b .side a.open { background: rgba(255,255,255,.1); }
.sk-b .side .sub { margin: 2px 0 6px 22px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.18); }
.sk-b .side .sub .sg { font-size: .7rem; color: rgba(233,238,248,.5); padding: 8px 8px 2px; }
.sk-b .side .sub a { padding: 5px 8px; font-weight: 500; font-size: .86rem; border-radius: 8px; }
.sk-b .side .sub a.on { background: #fff; color: var(--navy); font-weight: 700; }
.sk-b .side .me { margin-top: auto; border-top: 1px solid rgba(255,255,255,.14); padding: 12px 8px 0; font-size: .85rem; }
.sk-b .content { padding: 26px 30px 60px; }
.sk-b .hello { border-radius: 22px; color: #fff; padding: 26px 30px 52px; margin-bottom: -30px;
  background: radial-gradient(circle at 85% 15%, rgba(232,67,64,.35), transparent 40%), linear-gradient(120deg, #0a2b70, #0c3994 55%, #2a56b8); }
.sk-b .hello h1 { margin: 4px 0 0; font-size: 1.8rem; } .sk-b .hello h1 em { font-style: normal; color: #ffd1cc; }
.sk-b .hello p { margin: 6px 0 0; color: rgba(255,255,255,.8); }
.sk-b .hello + .kpis { padding: 0 16px; position: relative; }
.sk-b .card { border-radius: 18px; box-shadow: 0 12px 24px -18px rgba(15,23,42,.35); }
.sk-b .page-h h1 { color: var(--navy); }

/* ================= 시안 C: 업무형 촘촘 ================= */
.sk-c { --r: 8px; --bg: #fff; display: grid; grid-template-columns: 60px 210px minmax(0, 1fr); font-size: 14px; }
.sk-c .rail { background: #0a2b70; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; position: sticky; top: 50px; height: calc(100vh - 50px); }
.sk-c .rail .mk { width: 38px; height: 38px; border-radius: 10px; background: #fff; display: grid; place-items: center; font-weight: 900; color: var(--red); margin-bottom: 10px; font-size: .95rem; cursor: pointer; }
.sk-c .rail .mk span { color: var(--blue); }
.sk-c .rail a { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: rgba(255,255,255,.7); }
.sk-c .rail a:hover { background: rgba(255,255,255,.08); }
.sk-c .rail a.on { background: rgba(255,255,255,.16); color: #fff; box-shadow: inset 3px 0 0 var(--red); }
.sk-c .subp { background: #f7f8fa; border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 50px; height: calc(100vh - 50px); overflow-y: auto; }
.sk-c .subp h4 { margin: 0 8px 12px; font-size: 1rem; }
.sk-c .subp .g { font-size: .72rem; color: var(--muted); padding: 10px 8px 4px; font-weight: 700; }
.sk-c .subp a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--ink2); text-decoration: none; }
.sk-c .subp a:hover { background: #eef0f4; }
.sk-c .subp a.on { background: #e6edfb; color: var(--blue); font-weight: 700; }
.sk-c .content { padding: 18px 24px 60px; }

addEventListener("keydown", (e) => e.key === "Escape" && closeLayer());

  layer(`<div class="drawer"><h2>${pg.emoji} ${strip(row[0])} <button class="x" onclick="closeLayer()">×</button></h2><div class="crumb">${pg.label}</div>
    <dl class="kv">${src.cols.map((c, k) => `<dt>${c}</dt><dd>${row[k]}</dd>`).join("")}</dl>
    <h3 style="font-size:.95rem">첨부 파일</h3><p class="empty-note">📎 스캔본·사진을 끌어다 놓으면 여기에 붙습니다.</p>
    <h3 style="font-size:.95rem">변경 기록</h3><ul class="hist"><li>등록<small>2026-10-02 · 관리자</small></li><li>상태 변경<small>2026-11-05 · 관리자</small></li></ul>
    <div class="btns" style="margin-top:18px"><button class="btn pri" onclick="editForm('${id}', ${i})">수정</button><button class="btn" onclick="closeLayer();toast('복사해서 새로 적기 창이 열립니다 (시안)')">복사해서 새로</button><button class="btn" style="color:var(--red)" onclick="closeLayer();toast('삭제했습니다 (시안이라 실제로는 그대로)')">삭제</button></div></div>`);
}
const strip = (s) => String(s).replace(/<[^>]+>/g, "");
function editForm(id, i) {
  const pg = PAGES[id], src = tableOf(id), row = i == null ? null : src.rows[i];
  layer(`<div class="modal"><h2>${pg.emoji} ${pg.label} ${row ? "수정" : "새로 적기"} <button class="x" onclick="closeLayer()">×</button></h2>
    <div class="fgrid">${src.cols.map((c, k) => `<label class="${k === 0 ? "wide" : ""}">${c}<input value="${row ? strip(row[k]).replace(/"/g, "") : ""}" placeholder="${c}"></label>`).join("")}
    <label class="wide">비고<textarea rows="2" placeholder="메모"></textarea></label></div>
    <div class="btns" style="justify-content:flex-end"><button class="btn" onclick="closeLayer()">취소</button><button class="btn pri" onclick="closeLayer();toast('저장했습니다 (시안이라 실제로 저장되진 않아요)')">저장</button></div></div>`, true);
}

function head(pg, extra = "", noPrint) {
  const a = AREA[pg.area];
  return `<div class="page-h"><div><div class="crumb"><a onclick="go('dash')">홈</a>${a ? ` › <a onclick="go('home-${a.key}')">${a.label}</a>` : ""}${pg.group ? ` › ${pg.group}` : ""}</div><h1>${st.d === "d" ? pg.emoji + " " : ""}${pg.label}</h1><div class="pdesc">${pg.desc || ""}</div></div>
    <div class="btns">${extra}${noPrint ? "" : `<button class="btn" onclick="toast('엑셀 파일을 내려받습니다 (시안)')">${ic("xls")}엑셀</button><button class="btn" onclick="go('print-${pg.id}')">${ic("print")}인쇄</button>`}</div></div>`;
}
function tableOf(id) {
  if (LEDGERS[id]) return LEDGERS[id];
  if (id === "leavestat") return { cols: ["이름","부서","입사일","발생","사용","잔여","사용률"], rows: PEOPLE.map(([n, d, , j, g, u]) => { const p = Math.round(u / g * 100); return [n, d, j, g, u, g - u < 0 ? `<span class="neg">${g - u}</span>` : g - u, `<span class="bar ${p > 100 ? "hi" : ""}"><i style="width:${Math.min(p, 100)}%"></i></span><span class="pct">${p}%</span>`]; }) };
  if (id === "emp") return { cols: ["이름","부서","직급","입사일","연락처","상태"], rows: PEOPLE.map(([n, d, r, j], i) => [n, d, r, j, `010-${1200 + i * 37}-${5600 + i * 91}`, T("g", "재직")]) };
  if (id === "week52") return { cols: ["이름","부서","월","화","수","목","금","토","합계"], rows: PEOPLE.slice(0, 8).map(([n, d], i) => { const v = [9.5, 9, 10, 9.5, 8.5 + (i % 3), i === 0 ? 2 : 0]; const s = v.reduce((a, b) => a + b, 0); return [n, d, ...v.map((x) => x || "-"), s > 48 ? `<span class="neg">${s}h ⚠</span>` : `<b>${s}h</b>`]; }) };
  if (id === "monthly") return { cols: ["이름","부서","근무일","지각","조퇴","결근","연장(h)","휴일(h)"], rows: PEOPLE.map(([n, d], i) => [n, d, 21 - (i % 3), i % 4 === 1 ? 1 : 0, 0, 0, (i * 2.5 % 9).toFixed(1), i % 5 === 0 ? 8 : 0]) };
  if (id === "person") return { cols: ["날짜","요일","출근","퇴근","근무시간","비고"], rows: [["11-09","월","08:21","18:05","8.7h",""],["11-06","금","08:35","17:58","8.4h",""],["11-05","목","09:07","18:30","8.4h",T("o","지각")],["11-04","수","08:15","20:12","10.9h",T("v","연장 2h")],["11-03","화","08:30","18:02","8.5h",""],["11-02","월","-","-","-",T("g","연차")]] };
  if (id === "hours") return { cols: ["부서","인원","1인 평균(주)","연장 합계(월)","최대"], rows: [["생산팀","11","45.2h","96h",T("r","50.5h")],["연구소","7","42.1h","31h","46h"],["품질팀","3","43.0h","18h","47h"],["관리팀","2","40.5h","4h","42h"],["영업구매팀","2","41.8h","9h","45h"]] };
  if (id === "users") return { cols: ["아이디","이름","권한","최근 로그인"], rows: [["snco","관리자",T("b","관리자"),"2026-11-09 16:40"],["viewer","조회용",T("k","일반"),"2026-11-01 09:12"]] };
  return { cols: [], rows: [] };
}
function tableView(id, filt = true) {

    <div class="tbl-wrap"><table class="t"><thead><tr>${s.cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>
    ${s.rows.map((r, i) => `<tr onclick="detail('${id}', ${i})">${r.map((c, k) => `<td>${k === 0 && (id === "leavestat" || id === "emp") ? av(c, i) : c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="empty-note">줄을 누르면 상세가 열립니다 · ${s.rows.length}건</p></div>`;

function segOn(el) { el.parentElement.querySelectorAll("span").forEach((s) => s.classList.toggle("on", s === el)); toast(`'${el.textContent}'만 보기 (시안)`); }
function filterRows(inp) { const q = inp.value.trim(); inp.closest(".card").querySelectorAll("tbody tr").forEach((tr) => tr.style.display = !q || tr.textContent.includes(q) ? "" : "none"); }

function ledger(id) { const pg = PAGES[id]; return head(pg, `<button class="btn pri" onclick="editForm('${id}')">${ic("plus")}새로 적기</button>`) + tableView(id); }

function kpi(l, n, u, t, k, c, w, to) { return `<div class="card kpi ${w ? "warn" : ""}" onclick="go('${to}')"><div class="l"><span class="ico" style="--c:${c}">${ic(k)}</span>${l}</div><div class="n">${n}<small>${u}</small></div><div class="t">${t}</div></div>`; }
function todoList() { return `<ul class="todo">${TODO.map(([to, t, s, c, dd]) => `<li onclick="go('${to}')"><span class="ico" style="--c:${AREA[PAGES[to].area].color}">${ic(PAGES[to].icon)}</span><div class="w"><b>${t}</b><span>${s}</span></div>${T(c, dd)}</li>`).join("")}</ul>`; }

    <label class="wide">자주 쓰는 인증에서 고르기<select><option>직접 입력</option><option>ISO 9001</option><option>ISO 14001</option><option>벤처기업 확인</option><option>이노비즈</option></select></label>
    <label>인증 이름<input placeholder="예: ISO 9001"></label><label>분류<select><option>경영시스템</option><option>기업 인증</option><option>제품 인증</option></select></label>
    <label>인증번호<input></label><label>인증 기관<input></label><label>취득일<input type="date"></label><label>유효기간 끝<input type="date"></label>
    <label>다음 심사일<input type="date"></label><label>상태<select><option>유효</option><option>진행 중</option><option>만료</option></select></label>
    <label class="wide">인증서 스캔본<input type="file"></label></div><div class="btns" style="justify-content:flex-end"><button class="btn" onclick="go('certs')">취소</button><button class="btn pri" onclick="toast('등록했습니다 (시안)');go('certs')">등록</button></div></div>`;
}
function simpleTable(pg) { return head(pg, pg.id === "emp" || pg.id === "users" ? `<button class="btn pri" onclick="editForm('${pg.id}')">${ic("plus")}${pg.id === "emp" ? "직원 추가" : "계정 추가"}</button>` : "") + tableView(pg.id); }

function printPage(id) {
  const pg = PAGES[id], s = tableOf(id);
  return `<div class="page-h"><div><div class="crumb"><a onclick="go('${id}')">‹ ${pg.label}로 돌아가기</a></div><h1>${pg.label} · A4 인쇄본</h1><div class="pdesc">화면에 보이는 종이 = 실제 인쇄 결과</div></div>
    <div class="btns"><button class="btn" onclick="toast('세로 방향으로 바꿉니다 (시안)')">세로</button><button class="btn pri" onclick="window.print()">${ic("print")}인쇄 · PDF 저장</button></div></div>
  <div class="print-wrap"><div class="paper-box" id="pbox"><div class="sheet" id="sheet">
    <div class="sh-top"><div><h2 class="sh-title">${pg.label}</h2><div class="sh-meta">2026년 11월 9일 기준 · ${s.rows.length}건</div></div>
      <table class="sign"><tr><th>담당</th><th>팀장</th><th>대표</th></tr><tr><td></td><td></td><td></td></tr></table></div>
    <table class="t"><thead><tr>${s.cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${s.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <div class="sh-foot"><span>출력 2026-11-09 16:50 · 1 / 1</span><img src="../public/logo.png" alt=""></div></div></div>
  <div class="explain card"><h3>새 사이트의 인쇄 방식</h3><ul><li>인쇄할 화면마다 <b>A4 크기(mm)로 설계한 종이</b>를 따로 둡니다.</li><li>화면 크기·배율과 상관없이 <b>보이는 그대로</b> 인쇄·PDF 저장됩니다.</li><li>한 장을 넘으면 <b>머리줄·결재란을 다음 장에도</b> 찍습니다.</li><li>머리글·결재란·로고·쪽 번호는 모든 문서가 같은 틀입니다.</li></ul></div></div>`;
}

function page() {
  const p = st.p;
  if (p === "dash") return dash();
  if (p.startsWith("home-")) return areaHome(p.slice(5));
  if (p.startsWith("print-")) return printPage(p.slice(6));
  const pg = PAGES[p];
  switch (pg.kind) {
    case "atthome": return attHome(pg); case "daily": return daily(pg); case "person": return person(pg); case "cal": return cal(pg); case "hours": return hours(pg);
    case "leavehome": return leaveHome(pg); case "org": return org(pg); case "certs": return certs(pg); case "certadd": return certAdd(pg); case "ledger": return ledger(p);
    default: return simpleTable(pg);
  }
}

/* ===================== 시안별 틀 ===================== */
function curArea() { const p = st.p; if (p.startsWith("home-")) return p.slice(5); const id = p.startsWith("print-") ? p.slice(6) : p; return PAGES[id]?.area || ""; }
function curId() { return st.p.startsWith("print-") ? st.p.slice(6) : st.p; }
function shell(inner) {
  const ca = curArea(), cid = curId();
  if (st.d === "a" || st.d === "e") {
    const a = AREA[ca];
    return `<div class="top"><div class="top-in"><img src="../public/logo.png" alt="" onclick="go('dash')">
      <nav class="nav"><a onclick="go('dash')" class="${st.p === "dash" ? "on" : ""}">대시보드</a>${NAV.map((x) => `<a onclick="go('home-${x.key}')" class="${x.key === ca ? "on" : ""}">${x.label}</a>`).join("")}</nav>
      <span class="me"><a onclick="go('users')" style="color:inherit">관리자</a> <button class="btn" style="padding:5px 10px" onclick="toast('로그아웃 (시안)')">로그아웃</button></span></div>
      ${a ? `<div class="subnav"><div class="subnav-in"><a onclick="go('home-${a.key}')" class="${st.p === "home-" + a.key ? "on" : ""}">${a.label} 홈</a>${a.groups.flatMap(([, it]) => it).map(([id, l]) => `<a onclick="go('${id}')" class="${id === cid ? "on" : ""}">${l}</a>`).join("")}</div></div>` : ""}</div>
      <div class="content">${inner}</div>`;
  }
  if (st.d === "b" || st.d === "f") return `<aside class="side"><div class="logo" onclick="go('dash')"><img src="../public/logo.png" alt=""></div>
      <a onclick="go('dash')" class="${st.p === "dash" ? "on" : ""}"><span class="ico">${ic("home")}</span>통합 대시보드</a><div class="g">업무</div>
      ${NAV.map((x) => `<a onclick="go('home-${x.key}')" class="${st.p === "home-" + x.key ? "on" : x.key === ca ? "open" : ""}"><span class="ico">${ic(x.icon)}</span>${x.label}</a>
        ${x.key === ca ? `<div class="sub">${x.groups.map(([g, it]) => `${g ? `<div class="sg">${g}</div>` : ""}${it.map(([id, l]) => `<a onclick="go('${id}')" class="${id === cid ? "on" : ""}">${l}</a>`).join("")}`).join("")}</div>` : ""}`).join("")}
      <div class="g">시스템</div><a onclick="go('users')" class="${cid === "users" ? "on" : ""}"><span class="ico">${ic("usercog")}</span>사용자 관리</a>
      <div class="me"><b>관리자</b> · 관리자</div></aside><main class="content">${inner}</main>`;
  if (st.d === "c") {
    const a = AREA[ca];
    return `<nav class="rail"><div class="mk" onclick="go('dash')">S<span>N</span></div><a onclick="go('dash')" class="${!a && cid !== "users" ? "on" : ""}" title="대시보드">${ic("home")}</a>
      ${NAV.map((x) => `<a onclick="go('home-${x.key}')" title="${x.label}" class="${x.key === ca ? "on" : ""}">${ic(x.icon)}</a>`).join("")}<a onclick="go('users')" title="사용자 관리" class="${cid === "users" ? "on" : ""}" style="margin-top:auto">${ic("usercog")}</a></nav>
      <aside class="subp">${a ? `<h4>${a.label}</h4><a onclick="go('home-${a.key}')" class="${st.p === "home-" + a.key ? "on" : ""}">${a.label} 홈</a>${a.groups.map(([g, it]) => `${g ? `<div class="g">${g}</div>` : ""}${it.map(([id, l]) => `<a onclick="go('${id}')" class="${id === cid ? "on" : ""}">${l}</a>`).join("")}`).join("")}`
        : `<h4>대시보드</h4><a onclick="go('dash')" class="${st.p === "dash" ? "on" : ""}">오늘</a>${NAV.map((x) => `<a onclick="go('home-${x.key}')">${x.label}</a>`).join("")}<div class="g">시스템</div><a onclick="go('users')" class="${cid === "users" ? "on" : ""}">사용자 관리</a>`}</aside>
      <main class="content">${inner}</main>`;
  }
  return `<aside class="nside"><div class="ws"><img src="../public/logo.png" alt="" onclick="go('dash')"></div><a onclick="go('dash')" class="${st.p === "dash" ? "on" : ""}">🏢 에쓰엔 업무 공간</a>
      ${NAV.map((x) => `<div class="sec" onclick="go('home-${x.key}')">${x.key === ca ? "▾" : "▸"} ${x.emoji} ${x.label}</div>${x.key === ca || st.p === "dash" ? x.groups.flatMap(([, it]) => it).map(([id, l, , em]) => `<a onclick="go('${id}')" class="${id === cid ? "on" : ""}">${em} ${l}</a>`).join("") : ""}`).join("")}
      <div class="sec">시스템</div><a onclick="go('users')" class="${cid === "users" ? "on" : ""}">⚙️ 사용자 관리</a></aside>
    <main class="content">${st.p === "dash" ? inner : `<div class="cover sm"></div><div class="main-pad">${inner}</div>`}</main>`;
}

function fitSheet() {
  const box = document.getElementById("pbox"), sh = document.getElementById("sheet");
  if (!box || !sh) return;
  sh.style.transform = "";
  const z = Math.min(1, (box.parentElement.clientWidth - 40) / sh.offsetWidth);
  sh.style.transform = `scale(${z})`;
  box.style.width = sh.offsetWidth * z + 40 + "px"; box.style.height = sh.offsetHeight * z + 40 + "px";
}
function render() {
  closeLayer();
  const app = document.getElementById("app");
  app.className = st.d === "e" ? "sk-a sk-e" : st.d === "f" ? "sk-b sk-f" : "sk-" + st.d;
  app.innerHTML = shell(page());
  document.querySelectorAll(".picker [data-d]").forEach((b) => b.classList.toggle("on", b.dataset.d === st.d));
  fitSheet(); scrollTo(0, 0);
}
document.querySelectorAll(".picker [data-d]").forEach((b) => b.onclick = () => { st.d = b.dataset.d; location.hash = st.d + "/" + st.p; });
addEventListener("hashchange", fromHash);
addEventListener("resize", fitSheet);
fromHash();
</script>
</body>
</html>
