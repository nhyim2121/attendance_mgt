[server]
# 업로드 최대 크기 (MB)
maxUploadSize = 200
# static/ 폴더(폰트)를 /app/static/ 주소로 제공
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2563c9"
font = "Paperlogy, sans-serif"
headingFont = "Paperlogy, sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "6px"

[[theme.fontFaces]]
family = "Paperlogy"
url = "app/static/fonts/Paperlogy-400.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Paperlogy"
url = "app/static/fonts/Paperlogy-500.ttf"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "Paperlogy"
url = "app/static/fonts/Paperlogy-600.ttf"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Paperlogy"
url = "app/static/fonts/Paperlogy-700.ttf"
weight = "700"
style = "normal"

[[theme.fontFaces]]
family = "Paperlogy"
url = "app/static/fonts/Paperlogy-800.ttf"
weight = "800"
style = "normal"

[[theme.fontFaces]]
family = "NexonLv1Gothic"
url = "app/static/fonts/NexonLv1Gothic-700.otf"
weight = "700"
style = "normal"
